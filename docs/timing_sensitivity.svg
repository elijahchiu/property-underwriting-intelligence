<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="490" viewBox="0 0 1050 490" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic construction timing sensitivity</title>
  <desc id="desc">With one month of lease-up, a four-week construction case and a six-week construction case have the same stabilized annual cash flow of 1,495 dollars. First-year operating cash flow drops from negative 1,556 dollars to negative 3,082 dollars, and total project uses rise by 350 dollars.</desc>
  <rect width="1050" height="490" fill="#f4f8fb" rx="18"/>
  <text x="44" y="54" fill="#18354a" font-family="Arial, sans-serif" font-size="25" font-weight="700">Construction timing changes year one</text>
  <text x="44" y="83" fill="#526a7d" font-family="Arial, sans-serif" font-size="15">Synthetic scenario · 4-week vs 6-week build · 1-month lease-up · not a forecast</text>
  <rect x="42" y="112" width="472" height="302" rx="14" fill="#ffffff" stroke="#d7e4ed"/>
  <text x="68" y="148" fill="#18354a" font-family="Arial, sans-serif" font-size="18" font-weight="700">First-year operating cash flow</text>
  <text x="68" y="173" fill="#718597" font-family="Arial, sans-serif" font-size="13">Pre-tax, pre-capex; excludes purchase and rehab principal</text>
  <line x1="93" y1="265" x2="463" y2="265" stroke="#a9bbc8" stroke-width="2"/>
  <rect x="156" y="265" width="95" height="67" rx="8" fill="#8abed7"/>
  <rect x="303" y="265" width="95" height="132" rx="8" fill="#477e9c"/>
  <text x="203" y="250" fill="#18354a" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700">-$1,556</text>
  <text x="350" y="250" fill="#18354a" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700">-$3,082</text>
  <text x="203" y="361" fill="#18354a" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">4 weeks</text>
  <text x="350" y="361" fill="#18354a" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">6 weeks</text>
  <text x="68" y="390" fill="#526a7d" font-family="Arial, sans-serif" font-size="13">Six weeks rounds up to 2 repair-carry months.</text>
  <rect x="536" y="112" width="472" height="302" rx="14" fill="#ffffff" stroke="#d7e4ed"/>
  <text x="562" y="148" fill="#18354a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Stabilized view stays separate</text>
  <text x="562" y="173" fill="#718597" font-family="Arial, sans-serif" font-size="13">Annualized stabilized cash flow is the same in both cases</text>
  <rect x="571" y="204" width="397" height="64" rx="10" fill="#e8f3f8"/>
  <text x="590" y="231" fill="#526a7d" font-family="Arial, sans-serif" font-size="14">Stabilized annual cash flow</text>
  <text x="944" y="243" fill="#245d7a" text-anchor="end" font-family="Arial, sans-serif" font-size="23" font-weight="700">$1,495</text>
  <rect x="571" y="281" width="397" height="54" rx="10" fill="#f4f8fb" stroke="#d7e4ed"/>
  <text x="590" y="313" fill="#526a7d" font-family="Arial, sans-serif" font-size="14">Annualized stabilized cash-on-cash</text>
  <text x="944" y="316" fill="#245d7a" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700">4.07% → 4.04%</text>
  <rect x="571" y="347" width="397" height="45" rx="10" fill="#fff6e7"/>
  <text x="590" y="375" fill="#7b5b22" font-family="Arial, sans-serif" font-size="14">Project uses increase by $350</text>
  <text x="44" y="452" fill="#718597" font-family="Arial, sans-serif" font-size="13">All inputs are fictional. Longer construction lowers year-one cash flow through lost rent and explicit carry assumptions.</text>
</svg>
