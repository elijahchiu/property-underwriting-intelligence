[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "property-underwriting-intelligence"
version = "0.2.0"
description = "Evidence-aware property underwriting and financial analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.scripts]
underwrite-demo = "property_underwriting.demo:main"

[tool.setuptools]
package-dir = {"" = "src", "portfolio_demo" = "portfolio_demo"}
include-package-data = true

[tool.setuptools.package-data]
property_underwriting = ["fixtures/*.json"]
portfolio_demo = ["data.json", "index.html", "assets/*.css", "assets/*.js"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["property_underwriting*", "portfolio_demo*"]
namespaces = false
